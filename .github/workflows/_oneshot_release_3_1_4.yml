name: one-shot HACS release 3.1.4
on:
  push:
    branches:
      - fix/3.1.4-runtime-consistency
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.4-runtime-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare HACS 3.1.4
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION = '3.1.4'
          root = Path('.')
          comp = root/'custom_components/sbc5_control_center'

          # Version metadata.
          manifest = comp/'manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['version'] = VERSION
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          const = comp/'const.py'
          text = const.read_text(encoding='utf-8')
          text, n = re.subn(r'(?m)^APP_VERSION = "\d+\.\d+\.\d+"$', f'APP_VERSION = "{VERSION}"', text, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION not found')
          const.write_text(text, encoding='utf-8')

          # Predictor quality entity mirrors the canonical App integration.
          sensor = comp/'sensor.py'
          text = sensor.read_text(encoding='utf-8')
          needle = '''    SensorSpec(unique_id="sbc5_ai_thermal_predictor_confidence", name="SBC5 AI Thermal Predictor Confidence",\n               value_fn=lambda d: _predictor_number(d, "confidence_percent"), icon="mdi:brain",\n               unit=PERCENTAGE, state_class=SensorStateClass.MEASUREMENT),\n'''
          addition = needle + '''    SensorSpec(unique_id="sbc5_ai_thermal_predictor_quality", name="SBC5 AI Thermal Predictor Quality",\n               value_fn=lambda d: d.thermal_predictor.get("quality_state") or None, icon="mdi:brain-check-outline"),\n'''
          if needle not in text:
              raise SystemExit('Predictor confidence sensor anchor missing')
          text = text.replace(needle, addition, 1)
          sensor.write_text(text, encoding='utf-8')

          # README is current-state documentation, so fix the stale 3.1.1 section.
          readme = root/'README.md'
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'\*\*Version \d+\.\d+\.\d+ · HACS-ready', f'**Version {VERSION} · HACS-ready', text, count=1)
          text = re.sub(r'### Current release — \d+\.\d+\.\d+\n\n.*?(?=\n### Capabilities)',
                        f'''### Current release — {VERSION}\n\nVersion {VERSION} is aligned with SBC5 Control Center App/runtime {VERSION}. The integration exposes native AI Thermal Predictor forecast and quality diagnostics, including MAE, last error, confidence, quality state, temperature slope, validated samples and data age. Raspberry Pi host MAC/interface diagnostics remain available for Device Registry verification. Adaptive PWM and AI Cooling control behavior is unchanged.''',
                        text, count=1, flags=re.S)
          text = re.sub(r'### Aktualne wydanie — \d+\.\d+\.\d+\n\n.*?(?=\n### Możliwości)',
                        f'''### Aktualne wydanie — {VERSION}\n\nWersja {VERSION} jest zgodna z aplikacją/runtime SBC5 Control Center {VERSION}. Integracja udostępnia natywne sensory prognozy i jakości AI Thermal Predictor, w tym MAE, ostatni błąd, confidence, stan jakości, trend temperatury, liczbę zweryfikowanych prognoz i wiek danych. Diagnostyka fizycznego MAC/interfejsu Raspberry Pi pozostaje dostępna do weryfikacji Device Registry. Sterowanie Adaptive PWM i AI Cooling pozostaje bez zmian.''',
                        text, count=1, flags=re.S)
          readme.write_text(text, encoding='utf-8')

          # Changelog: history only.
          changelog = root/'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          if not re.search(r'^## 3\.1\.4\b', old, re.M):
              entry = '''## 3.1.4 — 2026-10-27\n\n### English\n\n#### Added\n- Added native `SBC5 AI Thermal Predictor Quality` sensor sourced from the existing AI runtime relay.\n\n#### Fixed\n- Aligned HACS version metadata and current README release information with App/runtime 3.1.4.\n\n#### Performance\n- No new polling loop; the quality sensor reuses the existing 15-second coordinator and AI runtime relay.\n\n#### Upgrade notes\n- Update through HACS. Restart Home Assistant only if HACS requests it. No Raspberry Pi host restart is required.\n\n### Polski\n\n#### Dodano\n- Dodano natywny sensor `SBC5 AI Thermal Predictor Quality` korzystający z istniejącego relay AI runtime.\n\n#### Naprawiono\n- Wyrównano metadane wersji HACS i aktualne informacje w README z App/runtime 3.1.4.\n\n#### Wydajność\n- Bez nowej pętli odpytywania; sensor jakości korzysta z istniejącego 15-sekundowego koordynatora i relay AI runtime.\n\n#### Informacje o aktualizacji\n- Aktualizuj przez HACS. Home Assistant uruchom ponownie tylko wtedy, gdy HACS tego zażąda. Restart hosta Raspberry Pi nie jest wymagany.\n\n'''
              m = re.match(r'(#[^\n]*\n(?:\n)?)', old)
              old = old[:m.end()] + entry + old[m.end():] if m else entry + old
              changelog.write_text(old, encoding='utf-8')

          notes = root/f'RELEASE_NOTES_{VERSION}.md'
          notes.write_text('''# SBC5 Control Center Integration 3.1.4\n\n## English\n\n### Highlights\n- Adds native AI Thermal Predictor quality state alongside the existing forecast/error diagnostics.\n- Aligns HACS metadata and current README information with App/runtime 3.1.4.\n- No additional polling; the existing 15-second coordinator and AI runtime relay are reused.\n\n### Upgrade notes\n- Update SBC5 Control Center App/runtime to 3.1.4 through the Home Assistant Apps Store / configured SBC5 repository.\n- Update this companion integration through HACS.\n- Restart Home Assistant only when HACS requests it.\n- No Raspberry Pi host restart is required.\n\n## Polski\n\n### Najważniejsze zmiany\n- Dodaje natywny stan jakości AI Thermal Predictor obok istniejącej diagnostyki prognoz i błędów.\n- Wyrównuje metadane HACS i aktualne informacje README z App/runtime 3.1.4.\n- Bez dodatkowego odpytywania; wykorzystywany jest istniejący 15-sekundowy koordynator i relay AI runtime.\n\n### Aktualizacja\n- App/runtime SBC5 Control Center zaktualizuj do 3.1.4 przez Sklep Apps Home Assistant / skonfigurowane repozytorium SBC5.\n- Integrację towarzyszącą aktualizuj przez HACS.\n- Home Assistant uruchom ponownie tylko wtedy, gdy HACS tego zażąda.\n- Restart hosta Raspberry Pi nie jest wymagany.\n''', encoding='utf-8')
          PY
      - name: Validate syntax and JSON
        run: |
          python -m compileall -q custom_components/sbc5_control_center
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('custom_components/sbc5_control_center/manifest.json').read_text())
          PY
      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare SBC5 Control Center Integration 3.1.4'
          git push origin HEAD:fix/3.1.4-runtime-consistency
