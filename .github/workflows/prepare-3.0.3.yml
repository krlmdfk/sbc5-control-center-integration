name: Prepare HACS 3.0.3

on:
  push:
    branches:
      - maintenance/3.0.3
    paths:
      - .github/workflows/prepare-3.0.3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release
        run: python scripts/prepare_3_0_3.py
      - name: Validate syntax and metadata
        run: |
          python -m compileall -q custom_components/sbc5_control_center scripts
          python -c 'import json; json.load(open("custom_components/sbc5_control_center/manifest.json"))'
          git diff --check
      - name: Commit candidate and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/prepare-3.0.3.yml scripts/prepare_3_0_3.py
          git commit -m "Prepare SBC5 Control Center Integration 3.0.3"
          git push origin HEAD:maintenance/3.0.3
# retry after generator whitespace normalization
