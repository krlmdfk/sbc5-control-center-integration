name: Prepare HACS Ethernet Diagnostics 3.1.17

on:
  push:
    branches:
      - feat/ethernet-eee-stability-3.1.17

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ !contains(github.event.head_commit.message, 'generated: prepare HACS 3.1.17') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ethernet-eee-stability-3.1.17
          fetch-depth: 0

      - name: Sync validated integration runtime from SBC5 app branch
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/krlmdfk/sbc5-control-center/feat/ethernet-eee-stability-3.1.17/custom_components/sbc5_control_center"
          for file in coordinator.py sensor.py const.py manifest.json; do
            curl -fsSL "$base/$file" -o "custom_components/sbc5_control_center/$file"
          done

      - name: Verify expected 3.1.17 Ethernet entities
        run: |
          python -m compileall -q custom_components
          grep -q '"version": "3.1.17"' custom_components/sbc5_control_center/manifest.json
          grep -q 'sbc5_ethernet_health' custom_components/sbc5_control_center/sensor.py
          grep -q 'ethernet_health.json' custom_components/sbc5_control_center/coordinator.py

      - name: Commit synchronized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sbc5_control_center
          git diff --cached --check
          git commit -m "generated: prepare HACS 3.1.17 Ethernet diagnostics"
          git push origin HEAD:feat/ethernet-eee-stability-3.1.17
