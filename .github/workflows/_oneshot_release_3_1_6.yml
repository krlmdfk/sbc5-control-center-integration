name: One-shot HACS 3.1.6 release preparation

on:
  push:
    paths:
      - 'scripts/_oneshot_release_3_1_6.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/3.1.6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare HACS 3.1.6
        run: python scripts/_oneshot_release_3_1_6.py
      - name: Validate syntax
        run: python -m compileall -q custom_components/sbc5_control_center
      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare HACS integration 3.1.6'
          git push origin HEAD:release/3.1.6
