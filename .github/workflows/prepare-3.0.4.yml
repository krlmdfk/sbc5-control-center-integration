name: Prepare HACS 3.0.4 one-shot

on:
  push:
    branches:
      - maintenance/3.0.4

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/3.0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 3.0.4 parity
        run: python scripts/prepare_3_0_4_parity.py
      - name: Validate local syntax and JSON
        run: |
          python -m compileall -q custom_components/sbc5_control_center scripts
          python -m json.tool custom_components/sbc5_control_center/manifest.json >/dev/null
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check
      - name: Remove one-shot tooling and commit
        run: |
          rm -f scripts/prepare_3_0_4_parity.py .github/workflows/prepare-3.0.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SBC5 Control Center Integration 3.0.4 — version parity"
          git push origin HEAD:maintenance/3.0.4
