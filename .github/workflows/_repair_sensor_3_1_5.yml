name: HACS 3.1.5 sensor repair
on:
  push:
    branches: [release/3.1.5-shadow-assist]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[sensor-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.1.5-shadow-assist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair sensor platform
        run: python scripts/_repair_sensor_3_1_5.py
      - name: Validate
        run: python -m compileall -q custom_components/sbc5_control_center
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/sbc5_control_center/sensor.py
          git commit -m 'fix: limit HACS 3.1.5 parity to Shadow Assist sensors [sensor-repaired]'
          git push origin HEAD:release/3.1.5-shadow-assist
