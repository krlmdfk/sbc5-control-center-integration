name: Repair CHANGELOG 3.0.2

on:
  push:
    branches:
      - maintenance/3.0.2
    paths:
      - scripts/repair_changelog_3_0_2.py
      - .github/workflows/repair-changelog-3.0.2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full CHANGELOG history
        run: python scripts/repair_changelog_3_0_2.py
      - name: Commit repaired CHANGELOG and remove one-shot tooling
        run: |
          git rm scripts/repair_changelog_3_0_2.py
          git rm .github/workflows/repair-changelog-3.0.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Restore full integration changelog history for 3.0.2"
          git push origin HEAD:maintenance/3.0.2
