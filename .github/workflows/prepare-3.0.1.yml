name: Prepare Integration 3.0.1

on:
  push:
    branches:
      - maintenance/3.0.1
    paths:
      - scripts/prepare_3_0_1.py
      - .github/workflows/prepare-3.0.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare integration 3.0.1
        run: python scripts/prepare_3_0_1.py
      - name: Compile Python
        run: python -m compileall -q custom_components/sbc5_control_center
      - name: Commit candidate
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git commit -m "Prepare SBC5 Control Center Integration 3.0.1"
          git push origin HEAD:maintenance/3.0.1
