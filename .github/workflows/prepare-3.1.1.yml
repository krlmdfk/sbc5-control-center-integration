name: Prepare HACS 3.1.1

on:
  push:
    branches: ["release/3.1.1"]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.1.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare HACS 3.1.1
        run: python scripts/prepare_hacs_3_1_1.py
      - name: Verify version surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/sbc5_control_center/manifest.json').read_text())
          assert manifest['version']=='3.1.1'
          assert 'APP_VERSION = "3.1.1"' in Path('custom_components/sbc5_control_center/const.py').read_text()
          assert Path('RELEASE_NOTES_3.1.1.md').is_file()
          PY
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md RELEASE_NOTES_3.1.1.md custom_components/sbc5_control_center/manifest.json custom_components/sbc5_control_center/const.py
          git commit -m "SBC5 Control Center Integration 3.1.1 — version parity"
          git push origin release/3.1.1
