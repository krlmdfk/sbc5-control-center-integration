name: one-shot HACS release 3.1.3
on:
  push:
    branches:
      - fix/3.1.3-predictor-quality-network-identity
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.3-predictor-quality-network-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata
        run: python scripts/_oneshot_release_3_1_3.py
      - name: Validate syntax and JSON
        run: |
          python -m compileall -q custom_components
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/sbc5_control_center/manifest.json custom_components/sbc5_control_center/const.py README.md CHANGELOG.md RELEASE_NOTES_3.1.3.md
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare SBC5 Control Center Integration 3.1.3'
          git push origin HEAD:fix/3.1.3-predictor-quality-network-identity
