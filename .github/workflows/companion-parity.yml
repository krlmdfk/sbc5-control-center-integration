name: Companion parity audit

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/sbc5_control_center/**'
      - 'local_apps/sbc5_control_center/bridge/**'
      - 'local_apps/sbc5_control_center/release.json'
      - 'scripts/check_companion_parity.py'
      - '.github/workflows/companion-parity.yml'
  pull_request:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: App / HACS integration parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strictly compare native HACS integration to SBC5 App main
        run: python scripts/check_companion_parity.py --role hacs --app-ref main
      - name: Strictly compare HACS PR 36 to SBC5 thermal PR 75 (candidate only)
        if: github.head_ref == 'safety/3-2-1-namespace-ownership-parity' || github.ref_name == 'safety/3-2-1-namespace-ownership-parity'
        run: python scripts/check_companion_parity.py --role hacs --app-ref fix/thermal-quality-hysteresis-20261110
