name: one-shot HACS 3.1.3 patch
on:
  push:
    branches:
      - fix/3.1.3-predictor-quality-network-identity
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.3-predictor-quality-network-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_oneshot_patch_3_1_3.py
      - name: Compile
        run: python -m compileall -q custom_components
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/sbc5_control_center/sensor.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: expose predictor quality and host network diagnostics'
          git push origin HEAD:fix/3.1.3-predictor-quality-network-identity
