name: HACS 3.1.5 parity helper
on:
  push:
    branches: [release/3.1.5-shadow-assist]
permissions:
  contents: write
jobs:
  parity:
    if: ${{ !contains(github.event.head_commit.message, '[hacs-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.1.5-shadow-assist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parity
        run: python scripts/_oneshot_hacs_3_1_5.py
      - name: Validate
        run: python -m compileall -q custom_components/sbc5_control_center
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/_oneshot_hacs_3_1_5.yml' ':!scripts/_oneshot_hacs_3_1_5.py'
          git commit -m 'SBC5 Control Center Integration 3.1.5 — Shadow Assist parity [hacs-ready]'
          git push origin HEAD:release/3.1.5-shadow-assist
